<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #fff);
        --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #1e1e1e);
        --text-2: var(--figma-color-text-secondary, #8a8a8a);
        --border: var(--figma-color-border, #e6e6e6);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --on-brand: var(--figma-color-text-onbrand, #fff);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, "Helvetica Neue", sans-serif;
        font-size: 11px;
        line-height: 1.4;
        color: var(--text);
        background: var(--bg);
        display: flex;
        flex-direction: column;
      }
      /* Área scrolleable: ocupa el alto disponible; el footer queda fijo abajo. */
      .scroll { flex: 1 1 auto; overflow-y: auto; }
      .footer { flex-shrink: 0; border-top: 1px solid var(--border); }
      .seccion {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .seccion:last-of-type { border-bottom: none; }
      .titulo {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-2);
        margin-bottom: 10px;
      }
      /* Toggles: lista vertical, checkbox + label */
      .toggles { display: flex; flex-direction: column; gap: 8px; }
      .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      .toggle input { width: 13px; height: 13px; margin: 0; accent-color: var(--brand); cursor: pointer; }
      /* Formato: filas label → control */
      .campos { display: flex; flex-direction: column; gap: 8px; }
      .campo { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .campo label { color: var(--text-2); }
      .campo select {
        font-size: 11px;
        padding: 3px 6px;
        min-width: 92px;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
      }
      /* Specs: checkboxes en grilla de 2 columnas */
      .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      /* CTA principal: botón ancho completo */
      .cta {
        width: 100%;
        font-size: 12px;
        font-weight: 600;
        padding: 10px;
        color: var(--on-brand);
        background: var(--brand);
        border: none;
        border-radius: 6px;
        cursor: pointer;
        text-align: center;
      }
      .cta:hover { opacity: 0.9; }
      .estado {
        padding: 10px 16px;
        min-height: 16px;
        font-size: 11px;
        color: var(--text-2);
        border-top: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="scroll">
    <div class="seccion">
      <div class="titulo">Specs</div>
      <div class="specs">
        <label class="toggle"><input type="checkbox" id="sec-anatomy" checked /> Anatomy</label>
        <label class="toggle"><input type="checkbox" id="sec-properties" /> Properties</label>
        <label class="toggle"><input type="checkbox" id="sec-layout" /> Layout &amp; Spacing</label>
        <label class="toggle"><input type="checkbox" id="sec-data" /> Data (JSON)</label>
        <label class="toggle"><input type="checkbox" id="sec-styling" /> Styling Inventory</label>
        <label class="toggle"><input type="checkbox" id="sec-modes" /> Modes</label>
        <label class="toggle"><input type="checkbox" id="sec-twoway" /> Two-Way</label>
        <label class="toggle"><input type="checkbox" id="sec-complete" /> Complete A/L</label>
      </div>
    </div>

    <div class="seccion">
      <div class="titulo">Opciones</div>
      <div class="toggles">
        <label class="toggle"><input type="checkbox" id="nested" /> Spec nested subcomponents</label>
        <label class="toggle"><input type="checkbox" id="dark" /> Dark mode</label>
        <label class="toggle"><input type="checkbox" id="tabla" /> Tabular anatomy</label>
        <label class="toggle"><input type="checkbox" id="hideOuter" /> Hide outer layout</label>
        <label class="toggle"><input type="checkbox" id="itemizar" /> Itemize instances</label>
        <label class="toggle"><input type="checkbox" id="medirHijos" /> Element measures</label>
        <label class="toggle"><input type="checkbox" id="mostrarRaw" checked /> Show raw value</label>
      </div>
    </div>

    <div class="seccion">
      <div class="titulo">Formato</div>
      <div class="campos">
        <div class="campo">
          <label for="columnas">Columns</label>
          <select id="columnas"><option>1</option><option>2</option><option>3</option><option>4</option></select>
        </div>
        <div class="campo">
          <label for="formatoColor">Color</label>
          <select id="formatoColor"><option>HEX</option><option>RGB</option><option>HSL</option></select>
        </div>
        <div class="campo">
          <label for="unidad">Units</label>
          <select id="unidad"><option>px</option><option>rem</option></select>
        </div>
        <div class="campo">
          <label for="formatoTipo">Type</label>
          <select id="formatoTipo"><option>Plain</option><option>CSS</option></select>
        </div>
        <div class="campo">
          <label for="formatoRaw">Raw value</label>
          <select id="formatoRaw"><option>HEX</option><option>RGB</option><option>HSL</option></select>
        </div>
        <div class="campo">
          <label for="preferencia">Preferred</label>
          <select id="preferencia"><option value="VARIABLE">Variable</option><option value="STYLE">Style</option></select>
        </div>
      </div>
    </div>
    </div>

    <div class="footer">
      <div class="seccion">
        <button id="crear" class="cta">Create spec</button>
      </div>
      <p class="estado" id="estado"></p>
    </div>
    <script src="ui.js"></script>
  </body>
</html>
